<!DOCTYPE html>
<html lang="en-GB">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width" />
    <title>XiVBiS Testing Grounds</title>
    <link rel="stylesheet" href="styles/style.css" />
  </head>
  <body>
    <h1>X<i>i</i>V-B<i>i</i>S<sub>.dev v0.0.2</sub></h1>
    <h2>Gear Stat Testing</h2>

    <dialog data-modal="sim">
      <button id="sim-modal-hide" class="popup-close">X</button>
      <p>Simulation Window</p>
      <div is="sim-timeline"></div>
      <div class="table-flex-wrap">
        <div class="table-scroll-wrap table-flex-group-primary">
          <table is="sim-infotable-damage"></table>
        </div>
        <div class="table-flex-group">
          <div class="table-scroll-wrap">
            <table is="sim-infotable-status"></table>
          </div>
          <div class="table-scroll-wrap">
            <table is="sim-infotable-gauge"></table>
          </div>
        </div>
      </div>
    </dialog>
    <button id="sim-modal-show" class="align-right">Simulation Window</button>

    <label for="config-level">Level Sync: </label>
    <input required type="number" id="config-level" name="level" min="50" max="100" step="10" value="100" />

    <div class="stats">
      <p>Item Stats:<br /><span id="item-stats"></span></p>
      <p>Expected Damage (100 Potency, assuming HQ):<br /><span id="item-dmg"></span></p>
    </div>

    <div class="gear-group" id="gear-group-weapon"></div>
    <div class="gear-pairs">
      <div id="gear-pair-left"></div>
      <div id="gear-pair-right"></div>
    </div>

    <script src="src/main.js" type="module"></script>
  </body>
</html>
