<!DOCTYPE html>
<html lang="en-GB">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width" />
    <title>XiVBiS Testing Grounds</title>
    <link rel="stylesheet" href="styles/style.css" />
  </head>
  <body>
    <h1>X<i>i</i>V-B<i>i</i>S<sub>.dev v0.0.1</sub></h1>
    <h2>Gear Stat Testing</h2>

    <div class="stats">
      <p>Item Stats:<br /><span id="item-stats"></span></p>
      <p>Expected Damage (100 Potency, assuming HQ):<br /><span id="item-dmg"></span></p>
    </div>

    <div class="pair">
      <div class="pair-left">
        <label for="weapon">Weapon Selection:</label>
        <select class="gear-selects" , id="weapon" , size="10"></select>
      </div>
      <div class="pair-right">
        <label for="offhand">Offhand Selection:</label>
        <select class="gear-selects" , id="offhand" , size="10"></select>
      </div>
    </div>

    <div class="pair">
      <div class="pair-left">
        <label for="head">Head Selection:</label>
        <select class="gear-selects" , id="head" , size="10"></select>
      </div>
      <div class="pair-right">
        <label for="ears">Ears Selection:</label>
        <select class="gear-selects" , id="ears" , size="10"></select>
      </div>
    </div>

    <div class="pair">
      <div class="pair-left">
        <label for="body">Body Selection:</label>
        <select class="gear-selects" , id="body" , size="10"></select>
      </div>
      <div class="pair-right">
        <label for="neck">Neck Selection:</label>
        <select class="gear-selects" id="neck" , size="10"></select>
      </div>
    </div>

    <div class="pair">
      <div class="pair-left">
        <label for="hands">Hands Selection:</label>
        <select class="gear-selects" , id="hands" , size="10"></select>
      </div>
      <div class="pair-right">
        <label for="wrists">Wrists Selection:</label>
        <select class="gear-selects" , id="wrists" , size="10"></select>
      </div>
    </div>

    <div class="pair">
      <div class="pair-left">
        <label for="legs">Legs Selection:</label>
        <select class="gear-selects" , id="legs" , size="10"></select>
      </div>
      <div class="pair-right">
        <label for="leftring">Ring Selection (Left):</label>
        <select class="gear-selects" , id="leftring" , size="10"></select>
      </div>
    </div>

    <div class="pair">
      <div class="pair-left">
        <label for="feet">Feet Selection:</label>
        <select class="gear-selects" , id="feet" , size="10"></select>
      </div>
      <div class="pair-right">
        <label for="rightring">Ring Selection (Right):</label>
        <select class="gear-selects" , id="rightring" , size="10"></select>
      </div>
    </div>

    <script src="src/main.js" type="module"></script>
  </body>
</html>
